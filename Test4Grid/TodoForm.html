<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    .container{
        margin: 0;
        padding: 0;
        height: 100vh;
        display:flex;
        justify-content: center;
        align-items: center;
    }
    .form{
        background-color: rgb(224, 164, 100);
        padding: 1.2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid black;
        border-radius: 1.2rem;
        box-shadow: 2px 2px 2px grey;

    }
    .title{
        border: 2px solid black;
        padding: 0.5rem 1rem;
        /* margin: 1rem; */
    }
    .Description{
        border: 2px solid black;
        padding: 1.5rem 1.2rem;
        margin: 1rem;
    }
    .Priority{
        border: 2px solid black;
        padding: 0.5rem 1.2rem;
    }
    .button{
        margin-top: 1rem;
        margin-left: 13rem;
    }
    .btn{
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        transition: all 0.6s ease-in-out;
        padding: 0.5rem 1rem;
        border: 2px solid black;
        border-radius: 0.3rem;
        
        &:hover{
            background-color: green;
            font-size: 15px;
            cursor: pointer;
            color: white;
        }
    }
</style>
<body>
    <div class="container">
        <div class="form">
            <h3 style="font-size: 25px;">Add List</h3>
            <input type="text" class="title" placeholder="Title">
            <input type="text" class="Description" placeholder="Description">
            <input type="text" class="Priority" placeholder="Priority">
            <div class="button">
                <input type="submit" class="btn" value="Submit">
            </div>
        </div>
    </div>
</body>
</html>
