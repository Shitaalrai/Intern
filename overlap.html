<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding:0;
        box-sizing: border-box;
    }
    .photo{
            width:20rem;
            height:20rem;
        }
    body{
        height:100vh;
    }
    .container{
        width:20rem;
        height:20rem;
        position:relative;
        top:calc(50% - 10rem);
        left:calc(50% - 10rem);
    }
    .text{
    width: 20rem;
    height: 20rem;
    position: absolute;
    background-color: rgb(0,0,0,0.200);
    top:calc(50% - 10rem);
    left:calc(50% - 10rem);
} 

</style>
<body>
    <div class="container">
        <img class="photo" src="image.jpeg">
        <div class=" text">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. At necessitatibus fugiat eaque eos ducimus rerum architecto consequatur cumque sapiente maxime. Tempora beatae magni facere eveniet at dicta perspiciatis fugit inventore.</p>
        </div>
    </div>
</body
</html>
