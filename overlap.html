<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding:0;
        box-sizing: border-box;
    }
    body{
        position: relative;
        height: 100vh;
    }
    .photo{
        width:20rem;
        height:20rem;
    }
    .image{
        width:20rem;
        height:20rem;
        position:absolute;
        top:calc(50% - 10rem);
        left:calc(50% - 10rem);
    
    }
.text{
    width: 20rem;
    height: 20rem;
    position: absolute;
    background-color: rgb(0,0,0,0.200);
    top:calc(50% - 10rem);
    left:calc(50% - 10rem);
}

</style>
<body>
    <div class="image">
        <img class="photo" src="image.jpeg">
    </div>
    <div class="text">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Itaque labore harum quod tenetur id aperiam dolores, incidunt optio deleniti hic earum libero numquam exercitationem deserunt possimus mollitia consequatur debitis quas.</p>
    </div>
</body
</html>
