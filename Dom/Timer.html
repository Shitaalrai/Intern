<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .time{
        display: flex;
        gap: 1rem;
        padding: 2rem;
        color: rgb(255, 10, 238);
        font-size: 40px;
    }
    .buttons{
        display: flex;
        gap: 2rem;
    }
    .btn{
        padding: 0.4rem 1.2rem;
    }
    .start{
        background-color: green;
        border: 2px solid black;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.6s ease-in-out;
        &:hover{
            background-color: rgb(3, 253, 3);
        }
    }
     .pause{
        background-color: rgb(253, 87, 4);
        border-radius: 4px;
        border: 2px solid black;
        cursor: pointer;
        transition: all 0.6s ease-in-out;
        display: none;
         &:hover{
            background-color: rgb(0, 0, 0);
            color: white;
        }
    }
    .resume{
        background-color: rgb(1, 1, 1);
        color: white;
        border-radius: 4px;
        border: 2px solid black;
        cursor: pointer;
        transition: all 0.6s ease-in-out;
        display: none;
         &:hover{
            background-color: rgb(245, 88, 4);
        }
    }
     .reset{
        background-color: rgb(148, 175, 148);
        border: 2px solid black;
        border-radius: 4px;
        transition: all 0.6s ease-in-out;
        cursor: pointer;
        &:hover{
            background-color: rgb(111, 36, 17);
            color: white;
        }
    }

</style>
<body>
    <div class="container">
        <div class="time">
            <span class="hour">00</span>
            <span>h:</span>
            <span class="minute">00</span>
            <span>m:</span>
            <span class="second">00</span>
            <span>s:</span>
        </div>
        <div class="buttons">
            <button class="btn start">Start</button>
            <button class="btn pause">Pause</button>
            <button class="btn resume">Resume</button>
            <button class="btn reset">Reset</button>
        </div>
    </div>
<script src="Timer.js"></script>
</body>
</html>
